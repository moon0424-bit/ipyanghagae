<!doctype html>
<html lang="ko">
<head>
<title>입양하개</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="유기동물 입양공고를 AI가 자세하게 정리해 주는 서비스">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%237A6A62%22/%3E%3Cpath fill=%22%23FBF8F1%22 d=%22M12.3 11.2c-3 0-6.3 4.4-6.3 7.1 0 1.9 1.5 2.7 3 2.7 1.3 0 2.2-.8 3.3-.8s2 .8 3.3.8c1.5 0 3-.8 3-2.7 0-2.7-3.3-7.1-6.3-7.1z%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app column; sticky header with role switch; views swap inside main. */
:root{
  /* palette: blue-gray #A0ABB7, cream #EAE3CE, sand #D1C1B0, taupe #907F77 (+ deeper taupe for text and buttons) */
  --bg:#EAE3CE; --surface:#FBF8F1; --surface-2:#F3EDDF; --field:#FFFDF8; --ink:#3B302B; --muted:#6B5D56; --line:#D1C1B0;
  --on-bg:#3B302B;
  --accent:#7A6A62; --accent-ink:#FBF8F1; --accent-soft:#E3D7CA;
  --amber:#875A12; --amber-soft:#F4E6CA; --red:#9C4336; --red-soft:#F1DCD5; --blue:#4D5967; --blue-soft:#DFE5EB;
  --gray:#A0ABB7; --taupe:#907F77;
  color-scheme:light;
  --font-display:"Gowun Dodum","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
/* Single warm cream-and-taupe look in every theme. */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--on-bg);font-family:var(--font-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px}
header.top[hidden]{display:none}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--font-display);font-size:21px;font-weight:400;letter-spacing:-.01em}
.brand small{color:#EFE6DA;font-size:13px;font-weight:600}
.home-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #A69890;background:#655750;color:var(--accent-ink);font:600 14px var(--font-body);padding:7px 12px;border-radius:999px;cursor:pointer;flex-shrink:0}
.home-btn svg{width:18px;height:18px}
.home-btn:hover{background:#584B45}
.home-btn:focus-visible{outline-color:var(--accent-ink)}
/* home */
.home{min-height:100svh;display:flex;flex-direction:column;justify-content:center;gap:36px;padding-block:48px}
.home .logo{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.home .mark{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.home .mark svg{width:50px;height:50px}
.home h1{font-family:var(--font-display);font-weight:400;font-size:42px;margin:0;letter-spacing:-.01em;line-height:1.1}
.home .tag{margin:0;color:var(--muted);font-size:15px}
.home .choices{display:flex;flex-direction:column;gap:12px}
.choice{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;color:var(--ink);font:inherit;width:100%}
.choice:hover{border-color:var(--accent)}
.choice .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center}
.choice .ic svg{width:28px;height:28px}
.choice b{display:block;font-size:18px;font-weight:700}
.choice span.d{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.choice .arr{color:var(--taupe);font-size:20px}
.home .foot{text-align:center;font-size:12px;color:var(--muted);margin:0}
main{padding-block:16px 48px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 12px}
h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
button,select,input,textarea{font-family:var(--font-body)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;padding:10px 14px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:default}
.btn.block{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--gray);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-fresh{background:var(--accent-soft);color:var(--accent)}
.b-warn{background:var(--amber-soft);color:var(--amber)}
.b-stale{background:var(--red-soft);color:var(--red)}
.b-info{background:var(--blue-soft);color:var(--blue)}
.b-plain{background:var(--surface-2);color:var(--muted)}
/* listing cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:76px 1fr;gap:12px;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
.card:hover{border-color:var(--accent)}
.thumb{width:76px;height:76px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.thumb svg{width:34px;height:34px;opacity:.75}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.hero-photo{width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover;border-radius:var(--r);display:block;background:var(--surface-2)}
.photo-cap{font-size:12px;color:var(--on-bg)}
.t-dog{background:#D1C1B0}.t-cat{background:#DFE5EB}.t-rabbit{background:#EADBD0}.t-etc{background:#E4DCC8}
.card .meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.card .name{font-weight:700;font-size:15.5px}
.card .line{color:var(--muted);font-size:13px}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.soft{background:var(--surface-2);border-color:transparent}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.size-sense{display:flex;gap:10px;align-items:center;background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:10px 12px;font-size:13.5px}
.size-sense b{color:var(--ink)}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.care{display:flex;flex-direction:column;gap:10px}
.care-item{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.care-item:first-child{border-top:0;padding-top:0}
.care-item .row{justify-content:space-between}
.missing li{color:var(--amber)}
.missing li span{color:var(--ink)}
.qlist{counter-reset:q;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qlist li{counter-increment:q;display:grid;grid-template-columns:24px 1fr;gap:6px}
.qlist li::before{content:counter(q);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
details.disease{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.disease summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;font-weight:700;list-style:none}
details.disease summary::-webkit-details-marker{display:none}
details.disease summary::after{content:"＋";color:var(--muted)}
details.disease[open] summary::after{content:"－"}
.dis-body{padding:0 14px 14px;display:grid;gap:8px}
.dis-body .f span{display:block;font-size:12px;color:var(--muted)}
.raw{font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.back{border:0;background:none;color:var(--on-bg);font-weight:700;font-size:14px;cursor:pointer;padding:0;align-self:flex-start}
.tel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tel code{font-family:var(--font-body);font-weight:700;font-size:16px;user-select:all}
/* forms */
form{display:flex;flex-direction:column;gap:14px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0;display:flex;flex-direction:column;gap:12px;background:var(--surface);min-width:0}
legend{font-weight:700;padding:0 6px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{font-size:15px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
label.f textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.req{color:var(--red)}
.beh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:center}
.beh .lab{font-size:14px}
.opt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.opt label{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer;color:var(--muted)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt input:checked + span{color:var(--ink);font-weight:700}
.opt label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.opt label:has(input:focus-visible){outline:2px solid var(--accent)}
.traits label{font-size:13px}
.err{color:var(--red);font-size:13px}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.verdict{font-family:var(--font-display);font-size:19px}
.v-good{color:var(--accent)}.v-adjust{color:var(--amber)}.v-re{color:var(--red)}
.res h3{font-size:14px}
.res .grp{display:flex;flex-direction:column;gap:4px}
.tabs{display:flex;gap:6px}
.mgmt{display:flex;flex-direction:column;gap:10px}
.mrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.mrow .row{justify-content:space-between}
.empty{color:var(--on-bg);text-align:center;padding:24px 8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:20}
@media (max-width:380px){.kv,.grid2{grid-template-columns:1fr}.beh{grid-template-columns:1fr}.opt{justify-content:flex-start}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>입양하개</b><small id="role-label">입양 희망자</small></div>
    <button class="home-btn" id="go-home" aria-label="홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>홈</span></button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => new Date().toISOString().slice(0,10);
const daysAgoISO = n => { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
const daysSince = iso => Math.max(0, Math.round((new Date(todayISO()) - new Date(iso)) / 86400000));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- reference data ---------- */
const BEH = [
  ["stranger","낯선 사람"],["dogs","다른 개"],["cats","고양이"],["kids","아이"],
  ["walk","산책(목줄)"],["alone","혼자 있기"],["toilet","배변 가리기"],["bark","짖음·울음이 적음"]
];
const BEH_VAL = {good:"좋음", mid:"보통", hard:"어려움", unknown:"모름"};
const VACCINES = {"개":["종합백신(DHPPL)","코로나 장염","켄넬코프","광견병","인플루엔자"], "고양이":["종합백신(FVRCP)","광견병","백혈병(FeLV)"]};
const VAC_VAL = {done:"완료", ing:"접종 중", none:"안 함·모름"};
const vaccHasDetail = v => v === "완료" || v === "접종 중";
function vaccSummary(a){
  const d = a.vaccDetail; if (!d) return "";
  const items = (d.list||[]).filter(x => x.status !== "none").map(x => `${x.name} ${VAC_VAL[x.status]}`);
  return [items.join(" · "), d.memo].filter(Boolean).join(" / ");
}
const TRAITS = ["활발함","차분함","소심함","사람을 좋아함","겁이 많음","호기심 많음","독립적","애교 많음"];

const DISEASES = {
  "파보바이러스 장염": {species:"개", one:"어린 강아지에게 특히 위험한 바이러스성 장염", symptoms:"구토, 피가 섞인 설사, 식욕 부진, 심한 탈수", contagion:"매우 높음. 분변으로 퍼지고 환경에 오래 남아요.", severity:"중증까지 갈 수 있어요. 어리거나 접종하지 않은 개에게 치명적일 수 있어요.", treat:"특효약은 없고 수액·대증 치료를 해요. 일찍 집중 치료할수록 회복 가능성이 높아져요.", prognosis:"고비를 넘기면 대부분 회복하고, 회복 후에는 면역이 생겨요.", check:"완치 판정을 받았는지, 집에 접종하지 않은 다른 개가 있는지 확인하세요."},
  "디스템퍼(홍역)": {species:"개", one:"호흡기·소화기·신경계에 영향을 주는 바이러스 질환", symptoms:"발열, 눈곱과 콧물, 기침, 구토·설사, 진행되면 경련 같은 신경 증상", contagion:"높음. 기침·콧물 같은 분비물로 퍼져요.", severity:"중증 질환이에요. 특히 신경 증상이 나타나면 위험해요.", treat:"특효약 없이 증상을 완화하는 치료를 해요.", prognosis:"회복하더라도 근육 떨림 같은 신경 후유증이 남을 수 있어요.", check:"현재 단계(회복기인지), 후유증 여부, 다른 개와의 접촉 가능 시점을 확인하세요."},
  "심장사상충": {species:"개", one:"모기를 통해 감염되는 기생충이 심장·폐동맥에 사는 질환", symptoms:"기침, 쉽게 지침, 운동을 힘들어함. 초기에는 증상이 없을 수 있어요.", contagion:"개끼리 직접 옮지 않아요. 모기가 매개해요.", severity:"감염 정도에 따라 경증부터 중증까지 다양해요.", treat:"치료 가능하지만 몇 달이 걸리고, 치료 중에는 운동을 엄격히 제한해야 해요.", prognosis:"조기에 치료하면 예후가 좋은 편이에요. 치료 후에는 매달 예방약이 필요해요.", check:"치료 단계, 남은 치료 기간과 비용, 운동 제한 기간을 확인하세요."},

function checkPrompt(a, ans){
  return `너는 유기동물 입양 희망자의 자가 체크를 돕는다. 아래 공고 정보와 입양 희망자의 생활 조건을 비교한다.

규칙:
1. 공고에 없는 동물 정보는 추측하지 않고 "확인 필요"로 다룬다.
2. good(잘 맞는 점), adjust(맞춰갈 점), reconsider(다시 생각해 볼 점)를 각각 0~4개, 한 문장씩 쓴다.
3. 입양을 무조건 권하거나 막지 말고, 파양을 줄이는 관점에서 솔직하게 쓴다.
4. questions는 보호소에 물어볼 질문 3~5개, 첫 질문은 "지금도 보호소에서 보호 중인가요?"
5. verdict는 "good","adjust","re" 중 하나. 해요체.

공고:
${JSON.stringify({종:a.species,품종:a.breed,나이:a.age,체중kg:a.weight,크기:sizeClass(a),성격:a.traits,행동관찰:Object.fromEntries(Object.entries(a.behavior||{}).map(([k,v])=>[BEH.find(x=>x[0]===k)?.[1]||k,BEH_VAL[v]])),메모:a.memo,질병:a.disease?`${a.disease.name} (${a.disease.status})`:"없음",권장산책분:walkMinutes(a)||"해당 없음"}, null, 1)}

입양 희망자:
${JSON.stringify(ans, null, 1)}

JSON만 답한다. 형식: {"verdict":"adjust","good":[""],"adjust":[""],"reconsider":[""],"questions":[""]}`;
}

function setRole(r){
  state.role = r;
  if (r !== "adopter") state.view = {name:"list"};
  render(); window.scrollTo(0, 0);
}
function render(){
  const app = $("#app");
  $("header.top").hidden = state.role === "home";
  $("#role-label").textContent = state.role === "reg" ? "공고 등록자" : "입양 희망자";
  if (state.role === "home"){
    app.innerHTML = homeHTML();
    document.querySelectorAll("[data-role]").forEach(b => b.onclick = () => setRole(b.dataset.role));
    return;
  }
  if (state.role === "adopter"){
    app.innerHTML = state.view.name === "detail" ? detailHTML(byId(state.view.id)) : listHTML();
  } else {
    app.innerHTML = regHTML();
  }
  bind();
}
function shelterCount(name, all){
  if (SHELTER_COUNTS[name] != null) return {n: SHELTER_COUNTS[name], pub:true};
  return {n: all.filter(a => a.shelter === name && a.status === "보호 중").length, pub:false};
}
function regionFilterHTML(all){
  const regions = [...new Set(all.map(regionOf))].sort((a, b) => (REGIONS.indexOf(a) + 1 || 99) - (REGIONS.indexOf(b) + 1 || 99));
  const inRegion = all.filter(a => state.region === "전체" || regionOf(a) === state.region);
  const shelters = [...new Set(inRegion.map(a => a.shelter))].sort();
  const sel = state.shelterSel;
  let summary = "";
  if (sel !== "전체"){
    const c = shelterCount(sel, all), shown = all.filter(a => a.shelter === sel), tel = shown[0]?.tel || "";
    summary = `<div class="panel soft" style="gap:6px"><div class="row" style="justify-content:space-between"><b>${esc(sel)}</b><span class="badge b-info">보호 중 ${c.n}마리</span></div>
      <span class="small muted">${c.pub ? "2026-10-27 공공데이터 기준 이 보호소의 보호 중 공고 수예요. 이 앱에는 그중 " + shown.length + "건이 보여요." : "이 앱에 등록된 보호 중 공고 수예요."}</span>
      ${tel ? `<span class="small">연락처 ${esc(tel)}</span>` : ""}</div>`;
  } else if (state.region !== "전체"){
    summary = `<p class="small muted" style="margin:0">${esc(state.region)} 지역 보호소 ${shelters.length}곳의 공고를 보고 있어요. 보호소를 고르면 보호 중인 동물 수를 볼 수 있어요.</p>`;
  }
  return `<div class="panel" style="gap:10px"><div class="grid2">
      <label class="f">지역<select id="sel-region"><option value="전체">전체 지역</option>${regions.map(r => `<option value="${esc(r)}"${r===state.region?" selected":""}>${esc(r)} (${all.filter(a => regionOf(a) === r).length})</option>`).join("")}</select></label>
      <label class="f">보호소<select id="sel-shelter"><option value="전체">전체 보호소</option>${shelters.map(s => `<option value="${esc(s)}"${s===sel?" selected":""}>${esc(s)} · 보호 중 ${shelterCount(s, all).n}마리</option>`).join("")}</select></label>
    </div>${summary}</div>`;
}

}

6. 해요체, 과장 없이. headline은 30자 이내.

기본 정보: ${JSON.stringify({종:a.species, 품종:a.breed, 나이:a.age, 체중kg:a.weight||"미상", 크기분류:sizeClass(a)||"해당 없음"})}
원래 공고 문구: """${a.raw}"""

JSON만 답한다. 형식:
{"headline":"","summary":"2~3문장","personality":[{"trait":"","evidence":"보호자 관찰: '...'"}],"care":[{"topic":"","text":"","basis":"일반 권고"}],"health_note":"","missing":[""],"questions":[""]}`;
}
const PERS_RE = /(순함|순해요|순하|온순|얌전|착함|순둥|겁|소심|경계|예민|공격|입질|하악|활발|명랑|애교|사람[^,./]{0,6}(좋아|따름|따라)|손길|손 잘 탐|사람손|낯가|짖|조용|차분|호기심)/;
function fallbackImprove(a){
  const parts = a.raw.split(/[,./\n]+/).map(s => s.trim()).filter(Boolean);
  const pers = parts.filter(p => PERS_RE.test(p)).map(p => ({trait:p, evidence:`보호자 관찰: '${p}'`}));
  const missing = ["다른 개·고양이와의 관계","아이와의 관계","혼자 있을 때 반응", ...(a.species === "개" ? ["배변 가리기","산책 습관"] : ["화장실 사용"]),"접종·건강 상태"];
  return {headline:`${a.age} ${a.breed}`.trim(), summary:`원래 공고 문구: ${a.raw}`, personality:pers, care:baseCare(a), health_note:"", missing, questions:["지금도 보호소에서 보호 중인가요?","혼자 있을 때 반응은 어떤가요?","다른 동물과 지내 본 적이 있나요?","접종이나 건강검진 기록이 있나요?"]};
}
async function runImprove(a, regen){
  if (!state.sample){ a.ai = fallbackImprove(a); state.idraft = {...state.idraft, animal:a, byAI:false, loading:false}; render(); return; }
  ctl?.abort(); ctl = new AbortController();
  state.idraft = {...state.idraft, animal:a, loading:true, error:null}; render();
  try {
    const ai = await state.sample.json(improvePrompt(a), {signal: ctl.signal, cache: regen ? false : true});
    if (!ai || !ai.headline) throw {code:"invalid_json"};
    ai.care = Array.isArray(ai.care) ? ai.care : baseCare(a);
    a.ai = ai; state.idraft = {...state.idraft, animal:a, byAI:true, loading:false};
  } catch(e){
    a.ai = a.ai || fallbackImprove(a);
    state.idraft = {...state.idraft, animal:a, byAI:false, loading:false, error: e?.code === "cancelled" ? "멈췄어요. 기본 정리 결과를 보여드려요." : aiErrorText(e)};
  }
  render();
}
function bindImprove(){
  const f = $("#iform");
  if (f){
    document.querySelectorAll("[data-sample]").forEach(b => b.onclick = () => {
      const x = SAMPLE_RAW[+b.dataset.sample];
      state.idraft = {input:{species:x.species, breed:x.breed, age:x.age, weight:x.weight, raw:x.raw}}; render();
    });
    f.onsubmit = e => {
      e.preventDefault();
      const g = id => ($("#"+id)?.value ?? "").trim();
      const input = {species:g("i-species"), breed:g("i-breed"), age:g("i-age"), weight:g("i-weight"), raw:g("i-raw")};
      if (!input.raw){ const er = $("#i-err"); er.textContent = "원래 공고 문구를 붙여넣어 주세요."; er.hidden = false; return; }
      const a = {id:"n"+Date.now().toString(36), species:input.species, breed:input.breed||"품종 미상", sex:"모름", neutered:"모름", age:input.age||"나이 미상", weight:parseFloat(input.weight)||0, color:"-",
        foundPlace:"-", foundDate:todayISO(), shelter:"예시 보호센터 A", tel:"000-0000-0001", vacc:"모름", lastChecked:todayISO(), status:"보호 중",
        raw:input.raw, traits:[], behavior:Object.fromEntries(BEH.map(([k]) => [k,"unknown"])), memo:input.raw, disease:null};
      state.idraft = {input, animal:a};
      window.scrollTo(0,0);
      runImprove(a, false);
    };
  }
  const redo = $("[data-iredo]"); if (redo) redo.onclick = () => { ctl?.abort(); state.idraft = {input: state.idraft.input}; render(); };
  const st = $("[data-istop]"); if (st) st.onclick = () => ctl?.abort();
  const rg = $("[data-iregen]"); if (rg) rg.onclick = () => runImprove(state.idraft.animal, true);
  const pub = $("[data-ipublish]"); if (pub) pub.onclick = () => {
    state.added.unshift({...state.idraft.animal}); saveAdded(); state.idraft = null; state.regTab = "manage"; render(); toast("정리한 공고를 등록했어요");
  };
  const fill = $("[data-ifill]"); if (fill) fill.onclick = () => {
    const i = state.idraft.input;
    state.draft = {form:{species:i.species, breed:i.breed, age:i.age, weight:parseFloat(i.weight), memo:i.raw, traits:[], behavior:{}, vacc:"모름", hasdis:"no"}};
    state.regTab = "new"; render(); refill(); window.scrollTo(0,0); toast("원래 문구를 관찰 메모에 옮겼어요");
  };
}

async function improveListing(id){
  const a = byId(id); if (!a || !state.sample) return;
  ctl?.abort(); ctl = new AbortController();
  state.aiLoading = id; render();
  try {
    const ai = await state.sample.json(improvePrompt(a), {signal: ctl.signal});
    if (!ai || !ai.headline) throw {code:"invalid_json"};
    ai.care = Array.isArray(ai.care) ? ai.care : baseCare(a);
    state.aiCache[id] = ai; store.set("aa_ai", state.aiCache); state.aiError = null;
  } catch(e){
    if (e?.code !== "cancelled") state.aiError = {id, msg: aiErrorText(e)};
  }
  state.aiLoading = null; render();
}

/* ---------- events ---------- */
let ctl = null;
function bind(){
  document.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { state.filter = b.dataset.filter; render(); });
  const sr = $("#sel-region"); if (sr) sr.onchange = () => { state.region = sr.value; state.shelterSel = "전체"; render(); };
  const ss = $("#sel-shelter"); if (ss) ss.onchange = () => { state.shelterSel = ss.value; render(); };
  const aib = $("[data-ai-improve]"); if (aib) aib.onclick = () => improveListing(aib.dataset.aiImprove);
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { state.view = {name:"detail", id:b.dataset.open}; render(); window.scrollTo(0,0); });
  const back = $("[data-back]"); if (back) back.onclick = () => { state.view = {name:"list"}; render(); };
  const copy = $("[data-copy]"); if (copy) copy.onclick = async () => {
    try { await navigator.clipboard.writeText(copy.dataset.copy); toast("번호를 복사했어요"); }
    catch(e){ const r = document.createRange(); r.selectNodeContents($("#tel")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("번호를 선택했어요. 복사해 주세요"); }
  };
  const chk = $("[data-check]"); if (chk) chk.onclick = () => runCheck(!!state.sample);
  document.querySelectorAll("[data-regtab]").forEach(b => b.onclick = () => { state.regTab = b.dataset.regtab; render(); });
  document.querySelectorAll("[data-confirm]").forEach(b => b.onclick = () => {
    const id = b.dataset.confirm; state.overrides[id] = {...(state.overrides[id]||{}), lastChecked: todayISO(), status:"보호 중"}; saveOverrides(); render(); toast("오늘 날짜로 확인했어요");
  });
  document.querySelectorAll("[data-status]").forEach(s => s.onchange = () => {
    const id = s.dataset.status; state.overrides[id] = {...(state.overrides[id]||{}), status: s.value, lastChecked: todayISO()}; saveOverrides(); render(); toast(`'${s.value}'로 바꿨어요`);
  });
  const form = $("#newform"); if (form) bindForm(form);
  if (state.role === "reg" && state.regTab === "improve") bindImprove();
  const redo = $("[data-redo]"); if (redo) redo.onclick = () => { ctl?.abort(); state.draft = {form: state.draft.form}; render(); refill(); };
  const stop = $("[data-stop]"); if (stop) stop.onclick = () => ctl?.abort();
  const regen = $("[data-regen]"); if (regen) regen.onclick = () => writeNotice(state.draft.animal, true);
  const pub = $("[data-publish]"); if (pub) pub.onclick = () => {
    const a = {...state.draft.animal}; delete a.demo;
    state.added.unshift(a); saveAdded(); state.draft = null; state.regTab = "manage"; render(); toast("공고를 등록했어요. 입양 희망자 화면에서 볼 수 있어요");
  };
}
function bindForm(form){
  const sp = $("#f-species"), has = $("#f-hasdis"), dn = $("#f-disname");
  sp.onchange = () => { const v = collect(); state.draft = {form: v}; render(); refill(); };
  has.onchange = () => { $("#dis-fields").hidden = has.value !== "yes"; };
  $("#f-vacc").onchange = e => { $("#vacc-fields").hidden = !vaccHasDetail(e.target.value); };
  dn.onchange = () => { $("#dis-other-wrap").hidden = dn.value !== "__other"; };
  form.onsubmit = e => {
    e.preventDefault();
    const v = collect(), err = $("#f-err");
    const miss = [];
    if (!v.breed) miss.push("품종"); if (!v.age) miss.push("나이"); if (!(v.weight > 0)) miss.push("체중");
    if (v.hasdis === "yes" && !(v.disname === "__other" ? v.disother : v.disname)) miss.push("질병명");
    if (miss.length){ err.textContent = `${miss.join(", ")}을(를) 입력해 주세요.`; err.hidden = false; return; }
    const animal = {
      id: "n" + Date.now().toString(36), species:v.species, breed:v.breed, sex:v.sex, neutered:v.neutered, age:v.age, weight:v.weight, color:v.color||"-",
      foundPlace:v.place||"-", foundDate:v.date||todayISO(), shelter:v.shelter||"-", tel:v.tel||"-", region:v.region||"예시 지역", vacc:v.vacc, lastChecked:todayISO(), status:"보호 중",
      raw: [v.traits.join(", "), v.memo].filter(Boolean).join(" / ") || "(입력 없음)", traits:v.traits, behavior:v.behavior, memo:v.memo,
      disease: v.hasdis === "yes" ? {name: v.disname === "__other" ? v.disother : v.disname, status: v.disstatus} : null,
      vaccDetail: vaccHasDetail(v.vacc) ? {list: v.vaccList.filter(x => x.status !== "none"), memo: v.vaccmemo} : null
    };
    state.draft = {form: v, animal, preview:true};
    window.scrollTo(0,0);
    writeNotice(animal, false);
  };
}
function collect(){
  const g = id => ($("#"+id)?.value ?? "").trim();
  const behavior = {};
  BEH.forEach(([k]) => { const r = document.querySelector(`input[name="beh-${k}"]:checked`); behavior[k] = r ? r.value : "unknown"; });
  return {species:g("f-species"), breed:g("f-breed"), sex:g("f-sex"), neutered:g("f-neutered"), age:g("f-age"), weight:parseFloat(g("f-weight")), color:g("f-color"), vacc:g("f-vacc"), place:g("f-place"), date:g("f-date"),
    traits:[...document.querySelectorAll(".traits input:checked")].map(i => i.value), behavior, memo:g("f-memo"),
    hasdis:g("f-hasdis"), disname:g("f-disname"), disother:g("f-disother"), disstatus:g("f-disstatus"), shelter:g("f-shelter"), tel:g("f-tel"), region:g("f-region"),
    vaccList:(VACCINES[g("f-species")]||[]).map((n, i) => ({name:n, status: document.querySelector(`input[name="vac-${i}"]:checked`)?.value || "none"})), vaccmemo:g("f-vaccmemo")};
}
function refill(){
  const v = state.draft?.form; if (!v) return;
  const set = (id, val) => { const el = $("#"+id); if (el && val !== undefined && val !== null && !Number.isNaN(val)) el.value = val; };
  ["breed","sex","neutered","age","color","vacc","place","date","memo","shelter","tel","disstatus","disother","vaccmemo","region"].forEach(k => set("f-"+k, v[k]));
  (v.vaccList||[]).forEach((x, i) => { const r = document.querySelector(`input[name="vac-${i}"][value="${x.status}"]`); if (r) r.checked = true; });
  if ($("#vacc-fields")) $("#vacc-fields").hidden = !vaccHasDetail(v.vacc);
  set("f-weight", v.weight); set("f-hasdis", v.hasdis); set("f-disname", v.disname);
  document.querySelectorAll(".traits input").forEach(i => i.checked = (v.traits||[]).includes(i.value));
  Object.entries(v.behavior||{}).forEach(([k, val]) => { const r = document.querySelector(`input[name="beh-${k}"][value="${val}"]`); if (r) r.checked = true; });
  if ($("#dis-fields")) $("#dis-fields").hidden = v.hasdis !== "yes";
  if ($("#dis-other-wrap")) $("#dis-other-wrap").hidden = v.disname !== "__other";
}
function fallbackNotice(a){
  const obs = Object.entries(a.behavior).filter(([k,v]) => v !== "unknown" && (a.species==="개"||k!=="walk"));
  const missing = BEH.filter(([k]) => (a.species==="개"||k!=="walk") && a.behavior[k] === "unknown").map(([,l]) => l);
  return {headline:`${a.age} ${a.breed}`, summary: a.memo || "관찰 메모가 없어요.",
    personality: [...a.traits.map(t => ({trait:t, evidence:"보호자 관찰: 성격 키워드"})), ...obs.map(([k,v]) => ({trait:`${BEH.find(x=>x[0]===k)[1]}: ${BEH_VAL[v]}`, evidence:"보호자 관찰: 행동 체크"}))],
    care: baseCare(a), health_note: a.disease ? `${a.disease.name} (${a.disease.status})` : "", missing,
    questions:["지금도 보호소에서 보호 중인가요?", ...missing.slice(0,3).map(m => `${m}은(는) 어떤가요?`)]};
}
async function writeNotice(a, regen){
  if (!state.sample){ a.ai = fallbackNotice(a); state.draft = {...state.draft, animal:a, byAI:false, loading:false}; render(); return; }
  ctl?.abort(); ctl = new AbortController();
  state.draft = {...state.draft, animal:a, loading:true, error:null}; render();
  try {
    const ai = await state.sample.json(noticePrompt(a), {signal: ctl.signal, cache: regen ? false : true});
    if (!ai || !ai.headline) throw {code:"invalid_json"};
    ai.care = Array.isArray(ai.care) ? ai.care : baseCare(a);
    a.ai = ai; state.draft = {...state.draft, animal:a, byAI:true, loading:false};
  } catch(e){
    if (e && e.code === "cancelled"){ state.draft = {...state.draft, loading:false, error:"멈췄어요. 다시 쓰거나 기본 초안을 쓸 수 있어요."}; a.ai = a.ai || fallbackNotice(a); }
    else { a.ai = a.ai || fallbackNotice(a); state.draft = {...state.draft, animal:a, byAI:false, loading:false, error: aiErrorText(e)}; }
  }
  render();
}
async function runCheck(useAI){
  const a = byId(state.view.id); if (!a) return;
  const g = k => $("#sc-"+k)?.value;
  const ans = {home:g("home"), alone:g("alone"), walk:g("walk")||"해당 없음", exp:g("exp"), pets:g("pets"), kids:g("kids"), budget:g("budget"), allergy:g("allergy")};
  if (!useAI){ state.view.check = {ans, result: ruleCheck(a, ans), ai:false}; render(); $("#selfcheck")?.scrollIntoView({block:"start"}); return; }
  const box = $("#sc-result");
  box.innerHTML = `<div class="panel soft"><div class="thinking"><span class="dot"></span>AI가 비교하고 있어요. 보통 10~40초 걸려요.</div></div>`;
  const btn = $("[data-check]"); if (btn) btn.disabled = true;
  ctl?.abort(); ctl = new AbortController();
  try {
    const r = await state.sample.json(checkPrompt(a, ans), {signal: ctl.signal});
    if (!r || !r.verdict) throw {code:"invalid_json"};
    state.view.check = {ans, result:r, ai:true};
    render(); $("#selfcheck")?.scrollIntoView({block:"start"});
  } catch(e){
    const rr = ruleCheck(a, ans);
    if (e?.code !== "cancelled") rr.note = aiErrorText(e).replace("AI 없이 만든 기본 결과", "기본 규칙으로 비교한 결과");
    state.view.check = {ans, result: rr, ai:false}; render();
  }
}
$("#go-home").onclick = () => { ctl?.abort(); setRole("home"); };
render();
</script>
